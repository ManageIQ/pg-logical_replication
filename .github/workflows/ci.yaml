name: CI
on:
  pull_request:
  push:
    branches-ignore:
    - dependabot/*
    - renovate/*
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version:
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
    services:
      postgres:
        image: manageiq/postgresql:13
        env:
          POSTGRESQL_USER: root
          POSTGRESQL_PASSWORD: smartvm
          POSTGRESQL_DATABASE: temp
        options: "--name postgres --volume /tmp/postgresql-cfg/:/opt/app-root/src/postgresql-cfg/ --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5"
        ports:
        - 5432:5432
    steps:
    - uses: actions/checkout@v6
    - name: Override postgres settings to enable logical replication
      run: |
        sudo chown -R $(id -u):$(id -g) /tmp/postgresql-cfg
        cp -rf .github/ci/postgresql-cfg/* /tmp/postgresql-cfg
    - name: Restart postgres
      run: |
        /usr/bin/docker run --rm -v "/var/run/docker.sock":"/var/run/docker.sock" docker restart postgres
        until [ "`/usr/bin/docker inspect -f {{.State.Health.Status}} postgres`" == "healthy" ]; do sleep 0.5; done
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{ matrix.ruby-version }}"
        bundler-cache: true
      timeout-minutes: 30
    - name: Set up tests
      run: bundle exec rake spec:setup
      env:
        POSTGRESQL_HOST: localhost
        POSTGRESQL_USER: root
        POSTGRESQL_PASSWORD: smartvm
    - name: Run tests
      run: bundle exec rake
      env:
        POSTGRESQL_HOST: localhost
        POSTGRESQL_USER: root
        POSTGRESQL_PASSWORD: smartvm
        CC_TEST_REPORTER_ID: "${{ secrets.CC_TEST_REPORTER_ID }}"
